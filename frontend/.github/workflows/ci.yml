name: CI — Loja

# Build, lint e testes automatizados rodam a cada push/PR. Os testes cobrem
# funções puras (lib/) e componentes reais com Vitest + Testing Library —
# não substitui os smoke tests manuais contra o backend real (fluxo
# completo, pagamento etc.), mas pega regressão de lógica e de UI antes de
# chegar em produção, sem depender de alguém rodar isso manualmente.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes automatizados
        run: npm test

      - name: Build de produção
        run: npm run build
